worker_processes 1;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;

    error_log /dev/stderr warn;

    server {
        listen 9080;
        root /var/www/dokuwiki;
        index index.php doku.php;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            try_files $uri $uri/ @dokuwiki;
        }

        location @dokuwiki {
            rewrite ^/_media/(.*) /lib/exe/fetch.php?media=$1 last;
            rewrite ^/_detail/(.*) /lib/exe/detail.php?media=$1 last;
            rewrite ^/_export/([^/]+)/(.*) /doku.php?do=export_$1&id=$2 last;
            rewrite ^/(.*) /doku.php?id=$1 last;
        }

        # Block internal directories (must be before PHP locations,
        # otherwise e.g. /conf/local.php would be executed as PHP)
        location ~ ^/(data|conf|bin|inc|vendor)/ {
            deny all;
        }

        location ~ /\.ht {
            deny all;
        }

        # DokuWiki exe files
        location ~ ^/lib/exe/.*\.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Plugin AJAX / endpoints (e.g. mcp.php).
        # lib/plugins is a symlink to /share/dokuwiki/plugins, so DOKU_INC must be
        # defined before the plugin script runs (see doku_inc.php in the Dockerfile).
        location ~ ^/lib/plugins/.*\.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PHP_VALUE "auto_prepend_file=/etc/php83/doku_inc.php";
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
}
